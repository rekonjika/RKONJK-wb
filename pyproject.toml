[project]
name = "rknjik-wb"
version = "1.0.0"
description = "High-performance Wildberries FBS/FBO & WMS ERP Engine based on DDD & CQRS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.2.0",
    "celery>=5.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pillow>=10.4.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.0.1",
    "qrcode>=7.4.2",
    "redis>=5.1.0",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.31.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # PEP8 errors
    "W",   # PEP8 warnings
    "F",   # Pyflakes (unused imports, undefined vars)
    "I",   # isort (import sorting)
    "C90", # Cyclomatic complexity
    "UP",  # Modern Python 3.11+ syntax upgrades
    "B",   # Bugbear common mistakes
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]